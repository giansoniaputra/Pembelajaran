<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="hasil"></h1>

    <script>
        let a = prompt("Masukan Data Pertama");
        let b = prompt("Masukan Data Kedua");

        let hasil = a * b

        document.getElementById("hasil").innerHTML = `Hasil dari ${a} x ${b} = ${hasil}`
    </script>
</body>

</html>
